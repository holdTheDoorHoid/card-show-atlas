# DRAFT. Daily data refresh: harvest, import issues, merge, geocode, estimate, check, build, commit.
#
# The schedule is switched off on purpose. The owner turns it on (remove the two # marks below) once
# real scripted sources are enabled in data/sources.yaml. Until then this runs only when started by hand
# from the Actions tab.
#
# Research waves are not part of this run. Import a wave with `csa import-research <wave>` and commit
# data/research/<wave>.jsonl, and the next refresh picks it up.
#
# Only data/ is committed. site/public/data/ is generated and ignored: the deploy workflow (pages.yml) runs
# `csa build` itself. The build step below is a dry run that proves the data can be built.
#
# If main is protected, the push at the end needs a rule that lets github-actions[bot] push, or this job
# should open a pull request instead.

name: Refresh data

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 9 * * *"   # every day at 09:17 UTC

permissions:
  contents: write     # commit the refreshed data
  issues: read        # read the open add-show, fix-show, organizer and removal issues
  actions: write      # start the site deploy, because a push made with GITHUB_TOKEN does not start other workflows

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install the pipeline
        run: pip install -e pipeline

      # A source that fails or is blocked must not stop the day. Its last good file stays in place.
      - name: Harvest scripted sources
        continue-on-error: true
        run: csa harvest all
      - name: Read open issues into the review queue
        continue-on-error: true
        run: csa import-issues

      - name: Merge
        run: csa merge
      - name: Geocode
        run: csa geocode
      - name: Estimate crowds
        run: csa estimate
      - name: Check (errors stop the run before anything is committed)
        run: csa check
      - name: Build the site data (not committed, only proves it builds)
        run: csa build
      - name: Counts
        run: csa stats

      - name: Commit the refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
