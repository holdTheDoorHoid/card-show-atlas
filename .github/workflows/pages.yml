name: Deploy site

on:
  push:
    branches: [main]
    # Research notes and docs do not change the site.
    paths-ignore:
      - "research/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The data pipeline writes site/public/data (shows.json and friends). Until it exists the
      # site builds with its empty state ("Shows are being added"). Sample data is never used here.
      - name: Look for the data pipeline
        id: pipeline
        run: |
          if [ -f pipeline/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::There is no pipeline/ yet, so there is no show data. The site will build with its empty state."
          fi

      - uses: actions/setup-python@v5
        if: steps.pipeline.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install the pipeline
        if: steps.pipeline.outputs.present == 'true'
        run: pip install -e pipeline

      # Store events (weekly play at card shops: Lorcana, Riftbound, Star Wars Unlimited rounds) are not committed to
      # the repository, so every deploy has to bring them. The websites they come from are asked at most once a day,
      # however many times the site is deployed: the day's files are kept in the Actions cache under a key made from
      # the UTC date, and `csa harvest --store` also skips a source it already harvested today.
      #
      # This never blocks the deploy. If the harvest fails, or a website refuses, the site is built with whatever
      # store events there are (none, on a day the cache is empty and the sites cannot be reached). The cache is
      # saved only after a clean harvest, so a bad hour does not leave an empty store layer for the rest of the day.
      - name: Today's date (UTC), for the store events cache
        id: today
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore today's store events
        id: store_cache
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: store-events-${{ steps.today.outputs.day }}

      - name: Harvest the store events (only if not done today)
        id: store
        if: steps.pipeline.outputs.present == 'true' && steps.store_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: csa harvest --store

      - name: Keep today's store events for the next deploy
        if: steps.store.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: store-events-${{ steps.today.outputs.day }}

      - name: Build the data (csa build)
        if: steps.pipeline.outputs.present == 'true'
        run: |
          if command -v csa >/dev/null 2>&1; then
            csa build
          else
            echo "::notice::pipeline/ has no csa command yet, so the data build was skipped. The site will build with its empty state."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
