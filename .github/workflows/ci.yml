name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-tests:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install the pipeline
        run: pip install -e "pipeline[dev]"
      - name: The command line starts
        run: csa --help
      - name: Tests (they never touch the network)
        working-directory: pipeline
        run: python -m pytest
      - name: Check the committed data
        run: csa check
